[project]
name = "halbach-ic"
version = "0.1.0"
description = "Otimização de arranjos Halbach para RM portátil de campo baixo (derivado de LUMC-LowFieldMRI/HalbachOptimisation)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "deap>=1.4",
    "matplotlib>=3.8",
    "magpylib>=5",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
halbach-ic = "halbach_ic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halbach_ic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
