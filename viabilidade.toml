# =============================================================================
# Análise de viabilidade: varreduras de parâmetros
#
# Cada arranjo simulado tem todos os anéis IGUAIS (sem otimização). Para cada
# varredura, um ou dois parâmetros mudam e os outros ficam no valor "base".
#
# Valores fixos que não aparecem aqui (folgas, densidade, direção do campo,
# campo alvo, bore mínimo e massa máxima) vêm do config.toml.
#
# Parâmetros que podem ser varridos:
#   n_rings           número de anéis
#   ring_spacing_mm   distância entre centros de anéis vizinhos
#   bore_radius_mm    raio livre interno
#   n_bands           camadas concêntricas de ímãs por anel
#   magnet_size_mm    aresta do cubo
#   remanence_T       remanência Br do material
#   dsv_diameter_mm   diâmetro da esfera onde a homogeneidade é medida
#
# Faixas: [início, fim, passo] (o fim entra se cair no passo).
# =============================================================================

[geral]
modelo = "cuboid"          # "cuboid" (exato) ou "dipole" (rápido)
pontos_superficie = 400    # pontos no oitavo da superfície do DSV
processos = 0              # 0 = todos os núcleos

# -----------------------------------------------------------------------------
# Cabeça
# -----------------------------------------------------------------------------
[cenarios.head]
ppm_maximo = 0             # 0 = homogeneidade não é corte, é objetivo (o mais perto de 100 %, melhor)
comprimento_min_mm = 540   # faixa aceita de comprimento do ímã
comprimento_max_mm = 760

# Referência = melhor arranjo de anéis iguais que atende a todos os requisitos
# (encontrado com scripts/buscar_referencia.py)
[cenarios.head.base]
n_rings = 47
ring_spacing_mm = 16.0
bore_radius_mm = 140.0
n_bands = 1
magnet_size_mm = 12.0
remanence_T = 1.3
dsv_diameter_mm = 200.0

# ---- gráficos de linha: x varia; cada curva é um valor da série ----
[[cenarios.head.linhas]]
x = "n_rings"
x_faixa = [1, 61, 1]
serie = "n_bands"
serie_valores = [1, 2, 3]

[[cenarios.head.linhas]]
x = "bore_radius_mm"
x_faixa = [100, 220, 5]
serie = "n_bands"
serie_valores = [1, 2, 3]

[[cenarios.head.linhas]]
x = "ring_spacing_mm"
x_faixa = [13, 40, 1]
serie = "n_rings"
serie_valores = [31, 39, 47, 55]

[[cenarios.head.linhas]]
x = "magnet_size_mm"
x_faixa = [6, 20, 1]
serie = "n_bands"
serie_valores = [1, 2]

[[cenarios.head.linhas]]
x = "remanence_T"
x_faixa = [1.1, 1.45, 0.05]

[[cenarios.head.linhas]]
x = "dsv_diameter_mm"
x_faixa = [40, 260, 10]
serie = "n_rings"
serie_valores = [23, 35, 47, 59]

# ---- mapas de calor: x e y variam juntos ----
[[cenarios.head.mapas]]
x = "n_rings"
x_faixa = [15, 61, 2]
y = "bore_radius_mm"
y_faixa = [100, 220, 5]

[[cenarios.head.mapas]]
x = "ring_spacing_mm"
x_faixa = [13, 40, 1]
y = "n_rings"
y_faixa = [15, 61, 2]

[[cenarios.head.mapas]]
x = "magnet_size_mm"
x_faixa = [6, 20, 1]
y = "bore_radius_mm"
y_faixa = [100, 220, 5]

